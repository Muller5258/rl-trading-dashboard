# docker-compose.yml
services:
  dashboard:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped

  pipeline:
    build: .
    command: python -m src.pipeline
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    profiles: ["jobs"]